name: Git forecast data PR (default disabled)
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-forecast-data-pr
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      vars.TRAVEL_GIT_FORECAST_ENABLED == 'true' &&
      github.repository == 'pengcc/travel-clothing-advisor' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate, collect once and reconcile one data PR
        env:
          TRAVEL_GIT_FORECAST_ENABLED: ${{ vars.TRAVEL_GIT_FORECAST_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: python -m web.git_forecast_refresh
