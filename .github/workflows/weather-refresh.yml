name: Git forecast data PR (default disabled)
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-forecast-data-pr
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      vars.TRAVEL_GIT_FORECAST_ENABLED == 'true' &&
      github.repository == 'pengcc/travel-clothing-advisor' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      pr: ${{ steps.publish.outputs.pr }}
      base: ${{ steps.publish.outputs.base }}
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate, collect once and reconcile one data PR
        id: publish
        env:
          TRAVEL_GIT_FORECAST_ENABLED: ${{ vars.TRAVEL_GIT_FORECAST_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: python -m web.git_forecast_refresh
  # Issue #84 Plan v6. Runs only for this run's own fresh `published` candidate.
  automerge:
    needs: refresh
    if: needs.refresh.outputs.pr != '' && needs.refresh.outputs.base != '' && needs.refresh.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.refresh.outputs.pr }}
      BASE: ${{ needs.refresh.outputs.base }}
      HEAD: ${{ needs.refresh.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify data PR (diagnostic, never merges)
        id: verify
        run: python -m web.git_forecast_refresh --auto-merge-verify "$PR" "$BASE" "$HEAD"
      - name: Merge exact head (schedule, first attempt, switch on)
        id: merge
        if: github.event_name == 'schedule' && github.run_attempt == 1 && vars.TRAVEL_FORECAST_AUTO_MERGE_ENABLED == 'true'
        env:
          TRAVEL_FORECAST_AUTO_MERGE_ENABLED: ${{ vars.TRAVEL_FORECAST_AUTO_MERGE_ENABLED }}
        run: python -m web.git_forecast_refresh --auto-merge "$PR" "$BASE" "$HEAD"
      - name: Close data PR unmerged (pause)
        if: ${{ failure() || cancelled() }}
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: python -m web.git_forecast_refresh --auto-merge-close "$PR"
