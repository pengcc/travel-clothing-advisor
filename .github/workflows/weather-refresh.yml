name: Featured weather refresh (default disabled)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-featured-weather
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      vars.TRAVEL_P1_ENABLED == 'true' &&
      github.repository == 'pengcc/travel-clothing-advisor' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRAVEL_P1_ENABLED: ${{ vars.TRAVEL_P1_ENABLED }}
      TRAVEL_P1_PROJECT_ID: ${{ vars.TRAVEL_P1_PROJECT_ID }}
      TRAVEL_P1_OWNER_ID: ${{ vars.TRAVEL_P1_OWNER_ID }}
      TRAVEL_P1_STORE_ID: ${{ vars.TRAVEL_P1_STORE_ID }}
      TRAVEL_P1_DB_HOST: ${{ vars.TRAVEL_P1_DB_HOST }}
      TRAVEL_P1_DB_NAME: ${{ vars.TRAVEL_P1_DB_NAME }}
      TRAVEL_P1_PROVIDER_GROUP: ${{ vars.TRAVEL_P1_PROVIDER_GROUP }}
      TRAVEL_P1_RECORDS_SHA256: ${{ vars.TRAVEL_P1_RECORDS_SHA256 }}
      TRAVEL_P1_CODE_VERSION: ${{ vars.TRAVEL_P1_CODE_VERSION }}
      TRAVEL_P1_CONFIG_SHA256: ${{ vars.TRAVEL_P1_CONFIG_SHA256 }}
      TRAVEL_P1_EPOCH: ${{ vars.TRAVEL_P1_EPOCH }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt --disable-pip-version-check
      - name: Refresh authorized fixed ten cities
        env:
          TRAVEL_P1_WORKER_DSN: ${{ secrets.TRAVEL_P1_WORKER_DSN }}
          TRAVEL_P1_BLOB_WRITE_TOKEN: ${{ secrets.TRAVEL_P1_BLOB_WRITE_TOKEN }}
          TRAVEL_P1_RECORDS_JSON: ${{ vars.TRAVEL_P1_RECORDS_JSON }}
          TRAVEL_P1_RECORDS_FILE: .local-tools/p1-cities.json
        run: |
          mkdir -p .local-tools
          python -c 'import os,pathlib; pathlib.Path(os.environ["TRAVEL_P1_RECORDS_FILE"]).write_text(os.environ["TRAVEL_P1_RECORDS_JSON"], encoding="utf-8")'
          python -m web.refresh_weather
